name: Run Scholar Citations

on:
  schedule:
    - cron: '01 0 * * *'
  workflow_dispatch:      # Allows manual runs from the Actions tab


permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Change to your Python version if needed

      - name: Install dependencies
        run: |
          pip install -r $GITHUB_WORKSPACE/scholar_citations_requirements.txt
      - name: Run script
        run: python ./scholar_citations.py
        
      - name: Commit and push updated citations chart
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add $GITHUB_WORKSPACE/_includes/chart.html
          git commit -m "Citations chart updated" || echo "No changes to commit"
          git pull --rebase origin main
          git push
