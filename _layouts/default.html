  <head>
    <script>
      // Quick check for suspect Lanzhou/China traffic
      fetch('https://ipapi.co/json/')
        .then(response => response.json())
        .then(data => {
          if (data.city === "Lanzhou" || data.region_code === "GS") {
            window.location.replace("about:blank");
          }
        })
        .catch(err => console.log("Geo-check skipped"));
    </script>
